<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TAP Connections</title>
  <meta name="description" content="TAP Connections - Toca. Conecta. Crece.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #25311b 0%, #11140f 32%, #080908 70%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
    }

    .profile {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .tap-logo {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #8daa4e;
      margin-bottom: 0;
    }

    .connections {
      font-size: 13px;
      letter-spacing: 7px;
      color: #eeeeee;
      margin-left: 7px;
      margin-bottom: 38px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #a8b1a2;
      font-size: 15px;
      margin-bottom: 34px;
    }

    .link {
      display: flex;
      align-items: center;
      position: relative;
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 15px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(141,170,78,0.55);
      border-radius: 16px;

      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;

      transition: 0.2s ease;
    }

    .link:hover {
      background: #8daa4e;
      color: #090a08;
      transform: translateY(-2px);
    }

    .icon {
      font-size: 22px;
      width: 32px;
      text-align: left;
    }

    .link-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .arrow {
      margin-left: auto;
      opacity: 0.65;
      font-size: 18px;
    }

    .hint {
      font-size: 12px;
      color: #737b70;
      margin-top: 26px;
      line-height: 1.6;
    }

    footer {
      margin-top: 55px;
      color: #5f665c;
      font-size: 11px;
      letter-spacing: 1px;
    }

    footer span {
      color: #8daa4e;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="profile">

    <div class="tap-logo">TAP)))</div>
    <div class="connections">CONNECTIONS</div>

    <h1>TAP Connections</h1>

    <p class="tagline">
      Toca. Conecta. Crece.
    </p>

    <a
      class="link"
      href="https://www.instagram.com/tapconnections.cuu/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">◎</span>
      <span class="link-text">Instagram</span>
      <span class="arrow">›</span>
    </a>

    <a
      class="link"
      href="https://wa.me/526142246342"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">◉</span>
      <span class="link-text">WhatsApp</span>
      <span class="arrow">›</span>
    </a>

    <p class="hint">
      Acerca tu dispositivo NFC para conectar<br>
      con TAP Connections.
    </p>

    <footer>
      POWERED BY <span>TAP CONNECTIONS</span>
    </footer>

  </main>

</body>
</html>
