<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CAMBIAR PARA CADA CLIENTE -->
  <title>NOMBRE DEL NEGOCIO | TAP Profile</title>
  <meta name="description" content="Perfil digital creado por TAP Connections">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1c2416 0%, #0e110d 35%, #050605 75%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 42px 20px 35px;
    }

    .profile {
      width: 100%;
      max-width: 430px;
      text-align: center;
      animation: aparecer .55s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 100%;
      max-width: 230px;
      max-height: 160px;
      object-fit: contain;
      display: block;
      margin: 0 auto 22px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #a9b0a5;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 34px;
    }

    .link {
      width: 100%;
      min-height: 76px;
      margin-bottom: 14px;
      padding: 16px 18px;

      display: flex;
      align-items: center;

      background: rgba(255,255,255,.055);
      border: 1px solid rgba(141,170,78,.55);
      border-radius: 18px;

      color: white;
      text-decoration: none;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(141,170,78,.13);
      border-color: #9bc84b;
    }

    .link:active {
      transform: scale(.98);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 13px;
      background: rgba(141,170,78,.10);
      color: #9bc84b;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .link-content {
      text-align: left;
      margin-left: 15px;
      flex: 1;
    }

    .link-title {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .link-subtitle {
      display: block;
      color: #858d81;
      font-size: 12px;
    }

    .arrow {
      font-size: 24px;
      color: #747b70;
      margin-left: 8px;
    }

    footer {
      margin-top: 44px;
      font-size: 10px;
      letter-spacing: 1.6px;
      color: #62685f;
    }

    footer span {
      color: #9bc84b;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      body {
        padding: 35px 14px 30px;
      }

      h1 {
        font-size: 25px;
      }

      .logo {
        max-width: 210px;
      }
    }
  </style>
</head>
